<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Fix Runs</title>
<!-- Filled in by the server when actions are enabled; write requests must echo it. -->
<meta name="auto-fix-token" content="">
<style>
:root {
  color-scheme: light;
  --ground: #ffffff; --ink: #1f2328; --muted: #5f6873; --faint: #8c959f; --line: #e3e6ea;
  --soft: #f6f8fa; --sel: #eaf1fd; --accent: #2f6feb;
  --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700; --run: #2f6feb;
  --mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0c0e; --ink: #d6dae1; --muted: #959ca6; --faint: #6e7681; --line: #262a30;
    --soft: #14161a; --sel: #16243a; --accent: #5b95ff;
    --ok: #3fb950; --bad: #f47067; --warn: #d29922; --run: #5b95ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: 48px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
}
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
header { border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 18px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand svg { flex: none; color: var(--accent); }
.nav { color: var(--muted); }
/* the state directory: clipped at its start, so the folder names that tell runs apart stay visible */
.root { color: var(--muted); font-family: var(--mono); font-size: 11.5px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: right; }
.live { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; white-space: nowrap; user-select: none; }
.live input { accent-color: var(--accent); margin: 0; }

main { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }

/* sidebar tree */
aside { background: var(--soft); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.search { padding: 14px 14px 8px; position: relative; }
.search .lu { position: absolute; left: 24px; top: 23px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 32px; padding: 0 10px 0 32px; font: inherit; color: var(--ink); border-radius: 6px;
  border: 1px solid var(--line); background: var(--ground); }
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline-offset: 0; border-color: var(--accent); }

#tree { overflow: auto; flex: 1; padding: 8px 0 16px; }
.group { display: flex; align-items: center; gap: 6px; padding: 5px 14px; color: var(--ink); font-weight: 600;
  cursor: pointer; user-select: none; }
.group:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.group .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.group .count .bad { color: var(--bad); }
.leaf { display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 30px; cursor: pointer; min-width: 0; }
.leaf:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.leaf.sel { background: var(--sel); box-shadow: inset 2px 0 var(--accent); }
.leaf .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.leaf .tm { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Lucide icons, one stroke family; status marks take the colour of their state */
.lu { flex: none; display: inline-block; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico { stroke-width: 2.1; }
.chev { width: 12px; height: 12px; color: var(--muted); vertical-align: -1px; transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
.chev.open { transform: rotate(90deg); }
span.chev { display: inline-block; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.lu.out { width: 12px; height: 12px; margin-left: 3px; vertical-align: -1px; opacity: 0.7; }
.copyable { display: inline-flex; align-items: center; gap: 2px; }
button.copy { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: none; border-radius: 4px; background: none;
  color: var(--muted); cursor: pointer; }
button.copy:hover { background: var(--soft); color: var(--ink); }
button.copy.done { color: var(--ok); }
button.copy .lu { vertical-align: 0; }
.spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.t-ok { color: var(--ok); } .t-bad { color: var(--bad); } .t-warn { color: var(--warn); }
.t-run { color: var(--run); } .t-none { color: var(--muted); }

/* content */
#content { overflow: auto; min-width: 0; }
.page { padding: 22px 28px 48px; max-width: 1500px; }
.crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.crumbs a { color: var(--muted); } .crumbs a:hover { color: var(--ink); }
.headline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.headline h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.headline .num { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.result { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 4px; font-size: 14px; }
.result b { font-weight: 600; }
.result .why { white-space: pre-wrap; }
.result .reason { color: var(--ink); }
a.pr { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
  background: var(--accent); color: #fff; }
a.pr:hover { text-decoration: none; background: color-mix(in srgb, var(--accent) 88%, #000); }
.subline { color: var(--muted); }

.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 14px 0 18px; overflow-x: auto; overflow-y: hidden; }
.tab { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; font: inherit; color: var(--muted); padding: 9px 0 8px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }

.tab .n { color: var(--muted); margin-left: -1px; font-weight: 400; font-variant-numeric: tabular-nums; }
.tab:focus-visible { outline-offset: -2px; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.box { border: 1px solid var(--line); border-radius: 8px; background: var(--ground); min-width: 0; overflow: hidden; }
.box > .hd { padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.box > .hd .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
.box > .hd .read { margin-left: auto; color: var(--ink); font-weight: 400; font-size: 12px; }
.box > .bd { padding: 12px 16px; }

.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.empty { color: var(--muted); padding: 40px 16px 48px; text-align: center; display: grid; justify-items: center; gap: 4px; }
.empty .et { color: var(--ink); font-weight: 600; font-size: 14px; margin-top: 8px; }
.empty .eb { max-width: 46ch; }
.empty .ea { margin-top: 10px; }
/* empty-state drawings: grey line art, one accent, the icons' round caps */
.art * { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.art .il-card { fill: var(--soft); stroke: var(--muted); }
.art path:not([class]), .art circle:not([class]) { stroke: var(--muted); }
.art .il-dash { stroke: var(--faint); stroke-dasharray: 3 4; }
.art .il-accent { stroke: var(--accent); }
.art .il-fill { fill: var(--ground); }
.art .il-dot { fill: var(--accent); stroke: none; }
.art .il-ground { stroke: var(--line); stroke-dasharray: 2 5; }
.loading { color: var(--muted); padding: 48px 0; display: flex; gap: 8px; align-items: center; justify-content: center; }
tr.lit td { background: var(--sel); }

.node { display: inline-flex; align-items: center; gap: 6px; }
.node .lu { color: var(--muted); }
.line.bad .node .lu { color: var(--bad); } .line.warn .node .lu { color: var(--warn); }

.afile { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.afile .del { font-weight: 400; color: var(--bad); } .afile .add { font-weight: 400; color: var(--ok); }

.alinks { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--soft); }
tr.sel td { background: var(--sel); }
/* A zero max-width lets the column take the remaining space and truncate instead of overflowing. */
td.grow { width: 100%; max-width: 0; }
td .ellipsis { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* build log */
.log { border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 12px; padding: 8px 0; overflow-x: auto; }
.line { display: grid; grid-template-columns: 82px 16px minmax(0, 1fr) auto; gap: 8px; padding: 2px 14px; align-items: baseline; cursor: pointer; }
.line:hover { background: var(--soft); }
.line .ts { color: var(--muted); }
.line .tw { color: var(--muted); }
.line .ms { color: var(--muted); }
.line.bad .nm { color: var(--bad); } .line.warn .nm { color: var(--warn); }
.nest { margin-left: 120px; padding: 4px 12px 8px 12px; border-left: 1px solid var(--line); }
.nest .row { color: var(--muted); }
button.link { background: none; border: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
button.link:hover { text-decoration: underline; text-underline-offset: 3px; }
button.btn { font: inherit; font-size: 12.5px; height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--ground); color: var(--ink); white-space: nowrap; }
button.btn:hover { border-color: var(--faint); }

/* json */
.json { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.json details { margin-left: 14px; }
.json summary { cursor: pointer; margin-left: -14px; list-style: none; }
.json summary::-webkit-details-marker { display: none; }
.json summary::before { content: "▸ "; color: var(--muted); }
.json details[open] > summary::before { content: "▾ "; }
.json .k { color: var(--muted); } .json .s { color: var(--ok); } .json .n, .json .b { color: var(--accent); }
.json .hint { color: var(--muted); }

/* model calls and artifacts */
.edit { border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; overflow: hidden; }
.edit .path { font-family: var(--mono); font-size: 11px; padding: 5px 10px; color: var(--muted); border-bottom: 1px solid var(--line); }
.edit pre { margin: 0; padding: 5px 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.edit .old { background: color-mix(in srgb, var(--bad) 8%, transparent); }
.edit .new { background: color-mix(in srgb, var(--ok) 8%, transparent); border-top: 1px solid var(--line); }
.split { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.file { display: flex; justify-content: space-between; gap: 8px; padding: 5px 14px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
.file:hover { background: var(--soft); } .file.sel { background: var(--sel); }
.file span:last-child { color: var(--muted); white-space: nowrap; }
pre.view { margin: 0; padding: 12px 16px; overflow: auto; max-height: 72vh; font-family: var(--mono); font-size: 12px; white-space: pre; }
pre.view .add { color: var(--ok); } pre.view .del { color: var(--bad); } pre.view .hunk { color: var(--muted); }

.badge { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
button.btn { display: inline-flex; align-items: center; gap: 6px; }
button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: transparent; }
button.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 500; }
button.btn.icon { width: 30px; padding: 0; justify-content: center; }
.ib { width: 24px; height: 24px; display: inline-grid; place-items: center; border: none; background: none; color: var(--muted);
  border-radius: 4px; cursor: pointer; padding: 0; flex: none; }
.ib:hover:not(:disabled) { background: var(--soft); color: var(--ink); }
.ib:disabled { opacity: 0.35; cursor: default; }
.ib .lu { vertical-align: 0; }
.ib .up { transform: rotate(-90deg); } .ib .down { transform: rotate(90deg); }

.field { display: grid; gap: 4px; margin-bottom: 14px; max-width: 440px; }
.field label { font-weight: 500; }
.field input:not([type="checkbox"]), .field select { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--ground); color: var(--ink); font: inherit; }
.field.check label { display: flex; gap: 8px; align-items: center; font-weight: 400; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.fhelp { color: var(--muted); font-size: 12px; }
.ferr { color: var(--bad); font-size: 12px; }
.ferr:empty { display: none; }
[aria-invalid="true"] { border-color: var(--bad) !important; }
details.adv { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
details.adv > summary { cursor: pointer; color: var(--muted); margin-bottom: 12px; }

.notice { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0 2px; padding: 8px 12px; border-radius: 6px;
  background: color-mix(in srgb, var(--warn) 9%, var(--ground)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); }
.notice > .lu { color: var(--warn); }
.notice .btn { margin-left: auto; }
.popover { position: fixed; z-index: 30; width: 320px; max-width: calc(100vw - 16px); padding: 12px; background: var(--ground);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px -8px rgb(0 0 0 / 0.3); }

.popover.menu { width: 220px; padding: 4px; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 7px 10px; border: none; background: none;
  color: var(--ink); font: inherit; border-radius: 4px; cursor: pointer; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--soft); outline-offset: -2px; }
.menu button.danger { color: var(--bad); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 40; }
.toast { background: var(--ink); color: var(--ground); padding: 9px 14px; border-radius: 6px; box-shadow: 0 8px 24px -8px rgb(0 0 0 / 0.35);
  max-width: min(560px, calc(100vw - 32px)); }
.toast.bad { background: var(--bad); color: #fff; }

/* TeamCity-style page: run list with the queue on top, Run and "…", a run page with details and plain tabs */
.qlink { height: 24px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--ground); color: var(--ink);
  font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
.qlink:hover { border-color: var(--faint); }
.qlink[hidden] { display: none; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 16px; }
.pagehead h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 2px; }
.tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.show { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.show select, .field input:not([type="checkbox"]), .field select { height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--ground); color: var(--ink); font: inherit; }
.runbtn { display: inline-flex; }
.runbtn .btn { border-radius: 0; }
.runbtn .btn:first-child { border-radius: 6px 0 0 6px; }
.runbtn .btn:last-child { border-radius: 0 6px 6px 0; padding: 0 10px; border-left-color: color-mix(in srgb, #fff 35%, var(--accent)); }
button.btn.small { height: 24px; padding: 0 8px; font-size: 12px; gap: 4px; }
td.rowtools { width: 1%; white-space: nowrap; text-align: right; padding-top: 4px; padding-bottom: 4px; }
td.rowtools > * { vertical-align: middle; }
tr.jobrow td { background: color-mix(in srgb, var(--soft) 70%, transparent); }
.titlebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.titlebar h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.titlebar .num { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.titlebar .actions { margin-left: auto; display: flex; gap: 6px; }
.statusline { font-size: 15px; margin: 8px 0 0; }
.statusline b { font-weight: 600; }
dl.info { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); gap: 7px 18px; max-width: 920px;
  margin: 16px 0 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
dl.info dt { color: var(--muted); }
dl.info dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack { display: grid; gap: 26px; }
.stack h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
h2 .sub { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
.mark { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
.mark .lu { vertical-align: 0; }
table.attempts .change { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.small { font-size: 11.5px; }
tr.detailrow > td { background: var(--soft); padding: 12px 16px 16px 36px; }
.adetail { display: grid; gap: 8px; }
.adetail .explain { white-space: pre-wrap; max-width: 80ch; }
.adetail .edit { max-width: 900px; margin: 0; background: var(--ground); }
.lu.down { transform: rotate(90deg); }
dialog { width: min(460px, calc(100vw - 32px)); padding: 20px 22px 18px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--ground); color: var(--ink); box-shadow: 0 24px 60px -16px rgb(0 0 0 / 0.4); }
dialog.wide { width: min(880px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(15 18 22 / 0.4); }
dialog h2 { font-size: 16px; margin: 0 0 14px; }
dialog p { margin: 0 0 12px; }
dialog .field { max-width: none; }
dialog .field input:not([type="checkbox"]), dialog .field select { width: 100%; }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.option:has(input:checked) { border-color: var(--accent); background: var(--sel); }
.option.off { opacity: 0.55; cursor: default; }
.option input { margin: 3px 0 0; accent-color: var(--accent); }
.option b { display: block; font-weight: 600; }
.option .muted { display: block; font-size: 12.5px; }
pre.log-view { max-height: 60vh; border: 1px solid var(--line); border-radius: 6px; }
@media (max-width: 700px) {
  dl.info { grid-template-columns: max-content minmax(0, 1fr); }
  .titlebar .actions { margin-left: 0; }
}

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); }
  aside { border-right: none; border-bottom: 1px solid var(--line); }

  .page { padding: 14px 16px 40px; }
  .nav, .root { display: none; }
  .hide-sm { display: none; }

  .line { grid-template-columns: 62px 14px minmax(0, 1fr) auto; }
  .nest { margin-left: 16px; }
  .box { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <a class="brand" id="home" href="#" title="All runs">
    <svg width="20" height="18" viewBox="0 0 22 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 12.5l9-4.5 9 4.5-9 4.5z" opacity=".45"/><path d="M2 9l9-4.5 9 4.5-9 4.5z"/></svg>
    Auto Fix
  </a>

        : running ? el("span", {class: "muted"}, "Waiting for the model…")
        : el("span", {class: "t-bad"}, calls.some(call => call.error) ? "No proposal: the model call failed" : "No proposal");
      const after = running && verify === running ? el("span", {class: "muted"}, "Running…")

        onclick: () => { open ? state.openAttempts.delete(row.label) : state.openAttempts.add(row.label); renderDetail(); }},
        el("td", {style: "white-space:nowrap"}, chevron(open), " ", row.label.replace("Attempt ", "#")),
        el("td", {class: "grow"}, el("div", {class: "change"}, change)),
        el("td", {style: "white-space:nowrap"}, after),
        el("td", {class: "num"}, spent === null ? "—" : duration(spent), model ? el("div", {class: "muted small"}, `model ${duration(model)}`) : null));

}
/** An opened attempt: the model's reasoning, the exact edits, what still fails, and where to look next. */
function attemptDetail(row, report, calls) {

  return el("div", {class: "adetail"},

    (proposal?.edits || []).map(edit => el("div", {class: "edit"}, el("div", {class: "path"}, edit.path), el("pre", {class: "old"}, edit.old), el("pre", {class: "new"}, edit.new))),

    el("div", {class: "alinks"}, el("button", {class: "link", type: "button", onclick: openLog}, "Open in build log"),

/* ---------- run controls ---------- */
// The server fills the token in only when it runs with --config; every write request echoes it.
const TOKEN = document.querySelector('meta[name="auto-fix-token"]').content;
const CAN_ACT = Boolean(TOKEN);
const REPLAYABLE = new Set(["baseline", "investigate", "repair", "verify"]);
const controls = {workflows: {}, jobs: [], runner: {alive: true, waiting: ""}};
const currentNode = detail => detail.summary.current || "the current step";

async function post(path, body) {
  const response = await fetch(path, {method: "POST", cache: "no-store",
    headers: {"Content-Type": "application/json", "X-Auto-Fix-Token": TOKEN}, body: JSON.stringify(body)});
  const data = await response.json().catch(() => ({error: `${response.status} ${response.statusText}`}));
  if (!response.ok) throw Object.assign(new Error(data.error || "Request failed"), {fields: data.fields || {}});
  return data;
}
/** A short message at the bottom of the window; the region is announced to screen readers. */
function toast(text, tone = "") {

}
function iconButton(name, label, onclick) {
  return el("button", {class: "ib", type: "button", title: label, "aria-label": label,
    onclick: event => { event.stopPropagation(); onclick(event); }}, lucide(name, 14));
}

/* A small menu under the button that opened it, like TeamCity's Actions dropdown. */
let popover = null;
function closePopover(refocus) {
  if (!popover) return;
  const anchor = popover.anchor;
  popover.remove();
  popover = null;
  if (refocus) anchor?.focus?.();
}
function openMenu(anchor, items) {
  closePopover();
  const rect = anchor.getBoundingClientRect();
  const box = el("div", {class: "popover menu", role: "menu"}, items.map(item =>
    el("button", {type: "button", role: "menuitem", class: item.danger ? "danger" : "", onclick: () => { closePopover(true); item.run(anchor); }},
      lucide(item.icon, 14), item.label)));
  box.anchor = anchor;
  box.style.top = Math.round(rect.bottom + 4) + "px";
  box.style.left = Math.round(Math.max(8, Math.min(rect.right - 240, innerWidth - 248))) + "px";
  document.body.append(box);

}
document.addEventListener("mousedown", event => { if (popover && !popover.contains(event.target)) closePopover(); });
document.addEventListener("keydown", event => { if (event.key === "Escape" && popover) closePopover(true); });
document.getElementById("content").addEventListener("scroll", () => closePopover());

/* Dialogs are native <dialog> elements: modal, Esc closes them and focus stays inside. */
const dialog = document.getElementById("dialog");
function openDialog(title, body, submitLabel, onSubmit, {danger = false, wide = false} = {}) {

    event.preventDefault();

      if (await onSubmit(form) !== false) dialog.close();
    } catch (problem) { error.textContent = problem.message; }
  }},
    el("h2", {}, title), body, error,
    el("div", {class: "dfoot"},
      onSubmit ? el("button", {class: "btn", type: "button", onclick: () => dialog.close()}, "Cancel") : null,
      el("button", {class: "btn " + (danger ? "danger" : "primary"), type: "submit"}, submitLabel)));
  dialog.className = wide ? "wide" : "";

  if (!dialog.open) dialog.showModal();

}
const confirmDialog = (title, text, label, danger = false) => new Promise(resolve => {
  openDialog(title, el("p", {}, text), label, () => { resolve(true); }, {danger});
  dialog.addEventListener("close", () => resolve(false), {once: true});
});

async function act(action, extra = {}, detail = state.detail) {
  try {
    const done = await post("/api/runs/action", {run: detail.summary.id, action, ...extra});
    toast(done.job ? `Queued: ${done.job.title}` : done.request
      ? `${action === "pause" ? "Pausing" : "Stopping"} after ${currentNode(detail)} finishes`
      : action === "stop" ? "Run stopped" : "Run cancelled");
    await refresh();
    if (!state.selected) renderHome();
    wake();
  } catch (error) { toast(error.message, "bad"); }
}
/** TeamCity's Stop dialog: after the current step (safe) or right away. */
function stopDialog(detail) {
  const actions = detail.controls?.actions || [], node = currentNode(detail);

  const option = (value, title, text, enabled) => el("label", {class: "option" + (enabled ? "" : " off")},
    el("input", {type: "radio", name: "how", value, disabled: !enabled, checked: enabled && (value === "cancel" || !safe) ? "" : null}),
    el("span", {}, el("b", {}, title), el("span", {class: "muted"}, text)));

    el("p", {class: "muted"}, `${detail.summary.name} is running ${node}.`),
    option("cancel", "After the current step", `${node} finishes and the run keeps a clean checkpoint.`, safe),
    option("stop", "Immediately", now ? `Kills ${node} and everything it started. The run can't be resumed.` : "Not possible while a pull request is being published.", now)),
  "Stop run", form => {

/** Re-run from a step: a new run that starts at that step, from the same commit and edits. */
function replayDialog(detail) {
  let attempt = 0;
  const choices = detail.steps.map(step => {
    if (step.node === "repair") attempt += 1;
    return {step, label: `Step ${step.index + 1} · ${step.node}` + (["investigate", "repair", "verify"].includes(step.node) ? ` (attempt ${Math.max(attempt, 1)})` : "")};
  }).filter(({step}) => step.index > 0 && REPLAYABLE.has(step.node));
  const pick = el("select", {id: "f-step"}, choices.map(({step, label}, i) => el("option", {value: step.index, selected: i === choices.length - 1 ? "" : null}, label)));
  openDialog("Re-run from a step", el("div", {},
    el("div", {class: "field"}, el("label", {for: "f-step"}, "Start at"), pick),
    el("p", {class: "muted"}, "A new run starts at that step from the same commit, with the edits made before it. This run stays as it is.")),

/** The run page's main button and the Actions menu with the rest. */
function runActions(detail) {
  if (!CAN_ACT || !detail.controls) return null;
  const {actions, note} = detail.controls, s = detail.summary;
  if (note) return el("span", {class: "muted"}, note);
  const live = s.status === "in_progress" && s.live, items = [];
  if (live && (actions.includes("cancel") || actions.includes("stop")))
    items.push({key: "stop", label: "Stop…", icon: "halt", run: () => stopDialog(detail)});
  if (actions.includes("resume")) items.push({key: "resume", label: "Resume", icon: "play", run: () => act("resume")});
  if (actions.includes("retry")) items.push({key: "retry", label: "Run again", icon: "rerun", run: () => act("retry")});
  if (actions.includes("publish")) items.push({key: "publish", label: "Publish pull request…", icon: "pr",
    run: async () => { if (await confirmDialog("Publish pull request", "Push the verified branch and open a pull request on Bitbucket?", "Publish")) act("publish"); }});
  if (actions.includes("reconcile")) items.push({key: "reconcile", label: "Reconcile with Bitbucket", icon: "reconcile", run: () => act("reconcile")});
  if (actions.includes("pause")) items.push({key: "pause", label: "Pause after this step", icon: "paused", run: () => act("pause")});
  if (actions.includes("replay")) items.push({key: "replay", label: "Re-run from a step…", icon: "rerun", run: () => replayDialog(detail)});
  if (!live && actions.includes("cancel")) items.push({key: "cancel", label: "Cancel run…", icon: "cancelled", danger: true,
    run: async () => { if (await confirmDialog("Cancel run", "Cancel this run? It can be run again or re-run from a step afterwards.", "Cancel run", true)) act("cancel"); }});
  if (!items.length) return null;
  const [main, ...rest] = items;
  return el("div", {class: "actions"},
    el("button", {class: "btn" + (main.key === "stop" ? "" : " primary"), type: "button", "data-key": "act:" + main.key, onclick: event => main.run(event.currentTarget)},
      lucide(main.icon, 13), main.label),
    rest.length ? el("button", {class: "btn", type: "button", "aria-haspopup": "menu", "data-key": "act:more", onclick: event => openMenu(event.currentTarget, rest)},
      "Actions", lucide("chevron", 12, "down")) : null);
}

/* ---------- queue ---------- */
async function loadJobs() {
  if (!CAN_ACT) return false;
  const data = await api("/api/jobs");
  const changed = JSON.stringify(data) !== JSON.stringify({jobs: controls.jobs, runner: controls.runner});
  controls.jobs = data.jobs;
  controls.runner = data.runner;
  const waiting = data.jobs.filter(job => job.status === "queued" || job.status === "running").length;
  const link = document.getElementById("queue-link");
  link.hidden = !waiting;
  link.textContent = `Queue · ${waiting}`;
  return changed;
}
async function removeJob(job) {
  try { await post("/api/jobs/remove", {id: job.id}); await loadJobs(); renderHome(); } catch (error) { toast(error.message, "bad"); }
}
async function stopJob(job) {
  if (!await confirmDialog("Stop job", `Stop "${job.title}" now? Its process and everything it started are killed.`, "Stop job", true)) return;
  try { await post("/api/jobs/stop", {id: job.id}); toast("Job stopped"); await loadJobs(); renderHome(); } catch (error) { toast(error.message, "bad"); }
}
async function openLog(job) {
  const text = await fetch("/api/jobs/log?id=" + encodeURIComponent(job.id), {cache: "no-store"})
    .then(response => response.ok ? response.text() : "");
  openDialog(job.title, el("pre", {class: "view log-view"}, text || "No output recorded yet."), "Close", null, {wide: true});
}

/* ---------- the "…" dialog: choose a workflow and its parameters ---------- */
const saved = kind => { try { return JSON.parse(sessionStorage.getItem("run:" + kind)) || {}; } catch (error) { return {}; } };
const remember = (kind, params) => { try { sessionStorage.setItem("run:" + kind, JSON.stringify(params)); } catch (error) { /* private mode */ } };
/** One form field built from the workflow's parameter schema. */
function field(param, value) {
  const id = "f-" + param.name, today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  value = value ?? (param.default === "today" ? today : param.default);
  let input;
  if (param.type === "bool") input = el("input", {type: "checkbox", id, checked: value ? "" : null});
  else if (param.type === "choice") input = el("select", {id}, param.choices.map(choice => el("option", {value: choice, selected: choice === value ? "" : null}, choice || "Any")));
  else if (param.type === "run") {
    const runs = state.runs.filter(run => run.id.startsWith("runs/") && (!param.statuses || param.statuses.includes(run.status)));
    input = el("select", {id}, el("option", {value: ""}, runs.length ? "Choose a run" : "No run can be retried"),
      runs.map(run => el("option", {value: run.name, selected: run.name === value ? "" : null}, `${run.name} · ${status(run.status).text}`)));
  } else input = el("input", {id, type: param.type === "int" ? "number" : param.type === "date" ? "date" : "text",
    value: value ?? "", min: param.min, max: param.max, step: param.type === "int" ? "1" : null, spellcheck: "false"});
  const help = param.help ? el("div", {class: "fhelp", id: id + "-help"}, param.help) : null;
  const error = el("div", {class: "ferr", id: id + "-err"});
  input.setAttribute("aria-describedby", [help && id + "-help", id + "-err"].filter(Boolean).join(" "));
  const node = param.type === "bool"
    ? el("div", {class: "field check"}, el("label", {for: id}, input, param.label), help, error)
    : el("div", {class: "field"}, el("label", {for: id}, param.label), input, help, error);
  return {param, node,
    read: () => param.type === "bool" ? input.checked : param.type === "int" ? (input.value === "" ? null : Number(input.value))
      : param.type === "run" ? input.value || null : input.value,
    error: message => { error.textContent = message || ""; input.setAttribute("aria-invalid", message ? "true" : "false"); }};
}
function openRunDialog(kind = state.runKind || "batch") {
  state.runKind = kind;
  const workflow = controls.workflows[kind], previous = saved(kind);
  const fields = workflow.params.map(param => field(param, previous[param.name]));
  const basic = fields.filter(item => !item.param.advanced), advanced = fields.filter(item => item.param.advanced);
  const pick = el("select", {id: "f-kind", onchange: event => openRunDialog(event.target.value)},
    Object.entries(controls.workflows).map(([key, item]) => el("option", {value: key, selected: key === kind ? "" : null}, item.title)));
  openDialog("Run workflow", el("div", {},
    el("div", {class: "field"}, el("label", {for: "f-kind"}, "Workflow"), pick, el("div", {class: "fhelp"}, workflow.description)),
    basic.map(item => item.node),
    advanced.length ? el("details", {class: "adv"}, el("summary", {}, "More options"), advanced.map(item => item.node)) : null),
  "Run", async () => {
    const params = Object.fromEntries(fields.map(item => [item.param.name, item.read()]));
    try {
      const done = await post("/api/jobs", {kind, params});
      remember(kind, params);
      toast(`Queued: ${done.job.title}`);
      await loadJobs();
      if (!state.selected) renderHome();
      wake();
    } catch (error) {
      for (const item of fields) item.error(error.fields[item.param.name]);
      if (!Object.keys(error.fields).length) throw error;
      dialog.querySelector('[aria-invalid="true"]')?.focus();
      return false;
    }
  });
}
async function setupControls() {
  if (!CAN_ACT) return;
  controls.workflows = (await api("/api/workflows")).workflows;
  await loadJobs();
  if (!state.selected) renderHome();
}

/* ---------- run page ---------- */
function renderDetail() { keepFocus(drawDetail); }
function drawDetail() {
  if (!["overview", "log", "calls", "files"].includes(state.tab)) state.tab = "overview";
  const hash = new URLSearchParams({run: state.selected});
  if (state.tab !== "overview") hash.set("tab", state.tab);
  history.replaceState(null, "", "#" + hash);
  const detail = state.detail, s = detail.summary, st = status(s.status);
  const running = s.status === "in_progress" && s.live;
  const used = detail.model_calls.reduce((sum, c) => sum + (tokens(c.usage, "in") || 0) + (tokens(c.usage, "out") || 0), 0);
  const tabs = [["overview", "Overview"], ["log", "Build log", detail.steps.length], ["calls", "Model calls", detail.model_calls.length],
    ["files", "Artifacts", detail.files.length]];
  dropFigure();
  const info = [
    ["Started", el("span", {title: when(s.started)}, shortWhen(s.started))],
    ["Duration", running && s.started ? clock(s.started) : duration(s.duration_seconds)],
    ["Repair attempts", String(s.attempts)],
    ["Model calls", `${detail.model_calls.length}` + (used ? ` · ${used.toLocaleString()} tokens` : "")],
    ["TeamCity build", s.build_url ? outLink(s.build_url, `#${s.build_id}`) : s.build_id ? `#${s.build_id}` : null],
    ["Revision", s.revision ? copyable(s.revision, s.revision.slice(0, 12), "revision") : null],
    ["Verified head", s.head ? copyable(s.head, s.head.slice(0, 12), "verified head") : null],
    ["Branch", s.branch ? copyable(s.branch, s.branch, "branch") : null],
    ["Pull request", s.pr_url ? outLink(s.pr_url, "Open in Bitbucket") : null],
    ["Re-run of", s.forked_from ? el("span", {}, el("a", {href: "#run=" + encodeURIComponent("runs/" + s.forked_from.source),
      onclick: event => { event.preventDefault(); select("runs/" + s.forked_from.source); }}, s.forked_from.source), ` from step ${s.forked_from.step + 1}`) : null],
  ].filter(([, value]) => value !== null && value !== "");
  let content;
  if (state.tab === "log") content = renderLog(detail);
  else if (state.tab === "calls") content = renderCalls(detail);
  else if (state.tab === "files") content = renderFiles(detail);
  else content = el("div", {class: "stack"},
    el("section", {}, el("h2", {}, "Tests"), testsGrid(detail)),
    el("section", {}, el("h2", {}, "Attempts", el("span", {class: "sub"}, "open a row for the explanation and the diff")), attemptsTable(detail)));
  const tabbar = el("div", {class: "tabs", role: "tablist", "aria-label": "Run sections", onkeydown: event => {
    // Left and Right move between tabs, as in any tab strip.
    const step = {ArrowRight: 1, ArrowLeft: -1}[event.key];
    if (!step) return;
    const i = tabs.findIndex(([key]) => key === state.tab), next = tabs[(i + step + tabs.length) % tabs.length][0];
    state.tab = next; renderDetail();
    document.querySelector(`[data-key="tab:${next}"]`)?.focus();
  }}, tabs.map(([key, label, n]) => el("button", {class: "tab", role: "tab", "aria-selected": String(state.tab === key), tabindex: state.tab === key ? "0" : "-1",
    "data-key": "tab:" + key, onclick: () => { state.tab = key; renderDetail(); }}, label, n !== undefined ? el("span", {class: "n"}, n) : null)));
  const line = running
    ? [el("b", {class: "t-run"}, "Running"), el("span", {}, ` · step ${detail.steps.length}, ${s.current || "starting"}`)]
    : [el("b", {class: "t-" + st.tone}, st.text), s.reason && st.tone !== "ok" ? el("span", {}, ": " + s.reason) : null];
  document.getElementById("content").replaceChildren(el("div", {class: "page"},
    el("nav", {class: "crumbs", "aria-label": "Breadcrumb"}, el("a", {href: "#", onclick: event => { event.preventDefault(); select(null); }}, "Run history"), " / ", groupName(s)),
    el("div", {class: "titlebar"}, statusIcon(s.status, 20), el("h1", {}, s.build_type || "Repair run"), el("span", {class: "num"}, s.name), runActions(detail)),
    el("div", {class: "statusline"}, line),
    s.request ? el("div", {class: "notice"}, lucide("clock", 16), el("span", {},
      `${s.request.request === "pause" ? "Pausing" : "Stopping"} after ${currentNode(detail)} finishes (asked by ${s.request.by} at ${when(s.request.at, false)}).`)) : null,
    el("dl", {class: "info"}, info.map(([key, value]) => [el("dt", {}, key), el("dd", {}, value)])),
    tabbar,
    el("div", {role: "tabpanel"}, content)));
}
/** Kept for the run page's lifecycle; the plain pages have no timers of their own. */
function dropFigure() {
  state.figure?.destroy();
  state.figure = null;
}

document.getElementById("q").addEventListener("input", () => { renderSidebar(); if (!state.selected) renderHome(); });
document.getElementById("home").addEventListener("click", event => { event.preventDefault(); select(null); });
document.getElementById("queue-link").addEventListener("click", () => select(null));
// Back and Forward between runs, and links pasted into the address bar.
window.addEventListener("hashchange", () => {
  const id = new URLSearchParams(location.hash.slice(1)).get("run");
  if (id !== state.selected) select(id, false);
});
async function refresh() {
  try {
    const [runsChanged, jobsChanged] = await Promise.all([loadRuns(), loadJobs()]);
    if (!state.selected) { if (runsChanged || jobsChanged) keepFocus(renderHome); }
    else {
      const current = state.runs.find(run => run.id === state.selected);
      // Re-read a run only when it changed, and never while an artifact is open.
      if (current && state.tab !== "files" && (current.status === "in_progress" || busy() || state.detail?.summary.updated !== current.updated)) await loadDetail();
    }
    tickClocks();
  } catch (error) { /* keep the last view while the server restarts */ }
}
loadRuns().then(() => state.selected && state.runs.some(r => r.id === state.selected) ? loadDetail() : (state.selected = null, renderSidebar(), renderHome()));
setupControls().catch(() => { /* the run history still works without controls */ });
/** Refresh every 4 seconds, or every 1.5 while a job runs or a stop request waits for its step to end. */
const busy = () => controls.jobs.some(job => job.status === "running" || job.status === "queued") || Boolean(state.detail?.summary.request);
let refreshTimer = 0;
function wake() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (document.getElementById("live").checked) await refresh();
    wake();
  }, busy() ? 1500 : 4000);
}
wake();
</script>
