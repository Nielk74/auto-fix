<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Fix Runs</title>
<style>
:root {
  color-scheme: light;
  --ground: #ffffff; --ink: #1f2328; --muted: #5f6873; --faint: #8c959f; --line: #e3e6ea;
  --soft: #f6f8fa; --sel: #eaf1fd; --accent: #2f6feb;
  --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700; --run: #2f6feb;
  --mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0c0e; --ink: #d6dae1; --muted: #959ca6; --faint: #6e7681; --line: #262a30;
    --soft: #14161a; --sel: #16243a; --accent: #5b95ff;
    --ok: #3fb950; --bad: #f47067; --warn: #d29922; --run: #5b95ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: 48px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
}
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* rows and list items take the ring inside their box, where a neighbour cannot cover it */
:is(tr, .leaf, .group, .arow, .line, .file, .filter):focus-visible { outline-offset: -2px; }

/* top bar */
header { border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 18px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand svg { flex: none; color: var(--accent); }
.nav { color: var(--muted); }
/* the state directory: clipped at its start, so the folder names that tell runs apart stay visible */
.root { color: var(--muted); font-family: var(--mono); font-size: 11.5px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: right; }
.live { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; white-space: nowrap; user-select: none; }
.live input { accent-color: var(--accent); margin: 0; }

main { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }

/* sidebar tree */
aside { background: var(--soft); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.search { padding: 14px 14px 8px; position: relative; }
.search .lu { position: absolute; left: 24px; top: 23px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 32px; padding: 0 10px 0 32px; font: inherit; color: var(--ink); border-radius: 6px;
  border: 1px solid var(--line); background: var(--ground); }
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline-offset: 0; border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 14px 12px; border-bottom: 1px solid var(--line); }
.filter { display: inline-flex; align-items: center; gap: 6px; height: 26px; border: 1px solid var(--line); background: var(--ground);
  color: var(--ink); border-radius: 13px; padding: 0 10px 0 8px; font: inherit; font-size: 12px; cursor: pointer; }
.filter .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.filter:hover:not(:disabled) { border-color: var(--faint); }
.filter.on { border-color: var(--accent); background: var(--sel); }
.filter:disabled { cursor: default; color: var(--faint); }
.filter:disabled .ico { opacity: 0.5; }
#tree { overflow: auto; flex: 1; padding: 8px 0 16px; }
.group { display: flex; align-items: center; gap: 6px; padding: 5px 14px; color: var(--ink); font-weight: 600;
  cursor: pointer; user-select: none; }
.group:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.group .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.group .count .bad { color: var(--bad); }
.leaf { display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 30px; cursor: pointer; min-width: 0; }
.leaf:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.leaf.sel { background: var(--sel); box-shadow: inset 2px 0 var(--accent); }
.leaf .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.leaf .tm { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Lucide icons, one stroke family; status marks take the colour of their state */
.lu { flex: none; display: inline-block; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico { stroke-width: 2.1; }
.chev { width: 12px; height: 12px; color: var(--muted); vertical-align: -1px; transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
.chev.open { transform: rotate(90deg); }
span.chev { display: inline-block; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.lu.out { width: 12px; height: 12px; margin-left: 3px; vertical-align: -1px; opacity: 0.7; }
.copyable { display: inline-flex; align-items: center; gap: 2px; }
button.copy { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: none; border-radius: 4px; background: none;
  color: var(--muted); cursor: pointer; }
button.copy:hover { background: var(--soft); color: var(--ink); }
button.copy.done { color: var(--ok); }
button.copy .lu { vertical-align: 0; }
.spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.t-ok { color: var(--ok); } .t-bad { color: var(--bad); } .t-warn { color: var(--warn); }
.t-run { color: var(--run); } .t-none { color: var(--muted); }

/* content */
#content { overflow: auto; min-width: 0; }
.page { padding: 22px 28px 48px; max-width: 1500px; }
.crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.crumbs a { color: var(--muted); } .crumbs a:hover { color: var(--ink); }
.headline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.headline h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.headline .num { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.result { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 4px; font-size: 14px; }
.result b { font-weight: 600; }
.result .why { white-space: pre-wrap; }
.result .reason { color: var(--ink); }
a.pr { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
  background: var(--accent); color: #fff; }
a.pr:hover { text-decoration: none; background: color-mix(in srgb, var(--accent) 88%, #000); }
.subline { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 12px 40px; margin: 18px 0 0; padding: 14px 0 12px; border-top: 1px solid var(--line); }
.fact .k { color: var(--muted); font-size: 12px; }
.fact .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fact .v .unit { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
.prov { display: flex; flex-wrap: wrap; gap: 4px 22px; padding: 0 0 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.prov > span { white-space: nowrap; }
.prov .k { color: var(--muted); margin-right: 6px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 14px 0 18px; overflow-x: auto; overflow-y: hidden; }
.tab { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; font: inherit; color: var(--muted); padding: 9px 0 8px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .lu { color: var(--accent); }
.tab .n { color: var(--muted); margin-left: -1px; font-weight: 400; font-variant-numeric: tabular-nums; }
.tab:focus-visible { outline-offset: -2px; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.box { border: 1px solid var(--line); border-radius: 8px; background: var(--ground); min-width: 0; overflow: hidden; }
.box > .hd { padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.box > .hd .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
.box > .hd .read { margin-left: auto; color: var(--ink); font-weight: 400; font-size: 12px; }
.box > .bd { padding: 12px 16px; }
.box > .foot { padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; min-height: 35px; }
.overview { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; margin-top: 16px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.empty { color: var(--muted); padding: 40px 16px 48px; text-align: center; display: grid; justify-items: center; gap: 4px; }
.empty .et { color: var(--ink); font-weight: 600; font-size: 14px; margin-top: 8px; }
.empty .eb { max-width: 46ch; }
.empty .ea { margin-top: 10px; }
/* empty-state drawings: grey line art, one accent, the icons' round caps */
.art * { fill: none; stroke: var(--faint); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.art .il-card { fill: var(--soft); stroke: var(--muted); }
.art path:not([class]), .art circle:not([class]) { stroke: var(--muted); }
.art .il-dash { stroke: var(--faint); stroke-dasharray: 3 4; }
.art .il-accent { stroke: var(--accent); }
.art .il-fill { fill: var(--ground); }
.art .il-dot { fill: var(--accent); stroke: none; }
.art .il-ground { stroke: var(--line); stroke-dasharray: 2 5; }
.loading { color: var(--muted); padding: 48px 0; display: flex; gap: 8px; align-items: center; justify-content: center; }
tr.lit td { background: var(--sel); }

/* attempt table */
.asummary { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; margin: 0 2px 12px; font-size: 13px; }
.asummary b { font-weight: 600; font-variant-numeric: tabular-nums; }
.asplit { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.abar { display: inline-flex; width: 160px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.abar i { display: block; height: 100%; }
.abar .m { background: var(--accent); } .abar .c { background: var(--ink); } .abar .o { background: var(--line); }
.key { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: 0; }
.key.m { background: var(--accent); } .key.c { background: var(--ink); }
.atable { overflow: visible; container-type: inline-size; }
.arow { display: grid; grid-template-columns: 112px minmax(180px, 1.15fr) 170px minmax(0, 1.5fr) 168px; gap: 6px 16px; align-items: center;
  grid-template-areas: "label time tests what clock"; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.arow > .alabel { grid-area: label; } .arow > .atime { grid-area: time; } .arow > .atests { grid-area: tests; }
.arow > .awhat { grid-area: what; } .arow > .atimecol { grid-area: clock; text-align: right; }
/* narrow: the bar keeps the first line, tests and what happened go underneath */
@container (max-width: 820px) {
  .arow { grid-template-columns: 96px minmax(0, 1fr) auto; grid-template-areas: "label time clock" ". tests tests" ". what what"; }
  .arow.ahead { grid-template-areas: "label time clock"; }
  .arow.ahead > .atests, .arow.ahead > .awhat { display: none; }
  .adetail { padding-left: 128px; }
}
.arow:hover { background: var(--soft); }
.arow.open { background: var(--soft); }
.arow.idle { cursor: default; color: var(--faint); }
.arow.ahead { cursor: default; background: none; color: var(--muted); font-size: 12px; padding-top: 8px; padding-bottom: 8px; }
.alabel { font-weight: 600; white-space: nowrap; }
.alabel .chev { margin-right: 4px; }
.alabel .kind { margin-right: 6px; color: var(--muted); }
.node { display: inline-flex; align-items: center; gap: 6px; }
.node .lu { color: var(--muted); }
.line.bad .node .lu { color: var(--bad); } .line.warn .node .lu { color: var(--warn); }
.atime { position: relative; min-width: 0; }
.aticks { position: relative; height: 14px; font-size: 11px; font-variant-numeric: tabular-nums; }
.aticks span { position: absolute; transform: translateX(-50%); color: var(--muted); }
.aticks span:first-child { transform: none; }
.atrack { position: relative; height: 14px; border-radius: 3px; background: linear-gradient(var(--line), var(--line)) 0 50% / 100% 1px no-repeat; }
.aseg { position: absolute; top: 1px; height: 12px; min-width: 3px; border: 1px solid var(--muted); border-radius: 3px; background: var(--ground); overflow: hidden; }
.aseg + .aseg { border-left-color: var(--faint); }
.aseg.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 22%, var(--ground)); }
.aseg.run { border-color: var(--run); border-style: dashed; animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { border-color: var(--faint); } }
@media (prefers-reduced-motion: reduce) { .aseg.run { animation: none; } }
.aseg i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 55%, var(--ground)); }
.aseg i.err { background: var(--bad); }
.apending { position: absolute; left: 0; top: -1px; font-size: 11.5px; color: var(--muted); }
.atests { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 12.5px; }
.tdots { display: inline-flex; gap: 3px; }
.tdots i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ok); background: var(--ok); }
.tdots i.fail { border-color: var(--bad); background: var(--bad); }
.tdots i.wait { background: transparent; border-color: var(--faint); border-style: dashed; }
.awhat { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.awhat .summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.afile { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.afile .del { font-weight: 400; color: var(--bad); } .afile .add { font-weight: 400; color: var(--ok); }
.atimecol { font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.adetail { padding: 6px 16px 14px 144px; border-bottom: 1px solid var(--line); background: var(--soft); display: grid; gap: 8px; cursor: default; }
.adetail .explain { white-space: pre-wrap; max-width: 80ch; }
.adetail .edit { max-width: 900px; margin: 0; background: var(--ground); }
.alinks { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; }
@container (max-width: 520px) { .adetail { padding-left: 16px; } }

/* workflow graph: the path the run took through the graph */
.flatstage { padding: 14px 16px 12px; }
svg.flat { display: block; max-height: 480px; }
svg.flat text { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--ink); }
svg.flat .fn rect { fill: var(--ground); stroke: var(--faint); stroke-width: 1; }
svg.flat .fn.idle rect { stroke: var(--line); stroke-dasharray: 3 3; }
svg.flat .fn.idle text { fill: var(--muted); }
svg.flat .fn.ran rect { stroke: var(--ink); }
svg.flat .fn.bad rect { stroke: var(--bad); }
svg.flat .fn.end rect { stroke-width: 2; }
svg.flat .fn.on rect { fill: var(--sel); }
svg.flat .fn[tabindex] { cursor: pointer; outline: none; }
svg.flat .fn[tabindex]:focus-visible rect { stroke: var(--accent); stroke-width: 2; }
svg.flat .glyph { fill: none; stroke: var(--muted); }
svg.flat .fn.ran .glyph { stroke: var(--ink); }
svg.flat .fn.bad .glyph { stroke: var(--bad); }
svg.flat .fn .count { font: 11px var(--mono); fill: var(--muted); }
svg.flat .fe { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
svg.flat .fe.on { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: none; }
svg.flat .tip { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
svg.flat .tip.on { stroke: var(--ink); } svg.flat .tip.off { stroke: var(--faint); }
svg.flat .fe-label { font: 10.5px var(--mono); fill: var(--ink); }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--soft); }
tr.sel td { background: var(--sel); }
/* A zero max-width lets the column take the remaining space and truncate instead of overflowing. */
td.grow { width: 100%; max-width: 0; }
td .ellipsis { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trail { font-variant-numeric: tabular-nums; white-space: nowrap; }
.trail .to { color: var(--faint); margin: 0 4px; }
.trail .to .lu { vertical-align: -1px; }

/* step table with duration bars */
.bar { height: 7px; position: relative; min-width: 80px; }
.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: var(--line); }
.bar i { position: absolute; top: 1px; height: 5px; border-radius: 2px; background: var(--muted); min-width: 3px; }

/* build log */
.log { border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 12px; padding: 8px 0; overflow-x: auto; }
.line { display: grid; grid-template-columns: 82px 16px minmax(0, 1fr) auto; gap: 8px; padding: 2px 14px; align-items: baseline; cursor: pointer; }
.line:hover { background: var(--soft); }
.line .ts { color: var(--muted); }
.line .tw { color: var(--muted); }
.line .ms { color: var(--muted); }
.line.bad .nm { color: var(--bad); } .line.warn .nm { color: var(--warn); }
.nest { margin-left: 120px; padding: 4px 12px 8px 12px; border-left: 1px solid var(--line); }
.nest .row { color: var(--muted); }
button.link { background: none; border: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
button.link:hover { text-decoration: underline; text-underline-offset: 3px; }
button.btn { font: inherit; font-size: 12.5px; height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--ground); color: var(--ink); white-space: nowrap; }
button.btn:hover { border-color: var(--faint); }

/* json */
.json { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.json details { margin-left: 14px; }
.json summary { cursor: pointer; margin-left: -14px; list-style: none; }
.json summary::-webkit-details-marker { display: none; }
.json summary::before { content: "▸ "; color: var(--muted); }
.json details[open] > summary::before { content: "▾ "; }
.json .k { color: var(--muted); } .json .s { color: var(--ok); } .json .n, .json .b { color: var(--accent); }
.json .hint { color: var(--muted); }

/* model calls and artifacts */
.edit { border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; overflow: hidden; }
.edit .path { font-family: var(--mono); font-size: 11px; padding: 5px 10px; color: var(--muted); border-bottom: 1px solid var(--line); }
.edit pre { margin: 0; padding: 5px 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.edit .old { background: color-mix(in srgb, var(--bad) 8%, transparent); }
.edit .new { background: color-mix(in srgb, var(--ok) 8%, transparent); border-top: 1px solid var(--line); }
.split { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.file { display: flex; justify-content: space-between; gap: 8px; padding: 5px 14px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
.file:hover { background: var(--soft); } .file.sel { background: var(--sel); }
.file span:last-child { color: var(--muted); white-space: nowrap; }
pre.view { margin: 0; padding: 12px 16px; overflow: auto; max-height: 72vh; font-family: var(--mono); font-size: 12px; white-space: pre; }
pre.view .add { color: var(--ok); } pre.view .del { color: var(--bad); } pre.view .hunk { color: var(--muted); }

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); }
  aside { border-right: none; border-bottom: 1px solid var(--line); }
  .overview, .split { grid-template-columns: minmax(0, 1fr); }
  .page { padding: 14px 16px 40px; }
  .nav, .root { display: none; }
  .hide-sm { display: none; }
  .facts { gap: 10px 24px; }
  .line { grid-template-columns: 62px 14px minmax(0, 1fr) auto; }
  .nest { margin-left: 16px; }
  .box { overflow-x: auto; }
}
</style>

/* ---------- workflow figure ---------- */
/** Rows by the longest forward path from start, a column within each row, and the back edges that make loops. */

  const rows = {};
  for (const node of order) (rows[layer[node]] ||= []).push(node);
  // The success path stays in the main lane; exits such as "blocked" sit in the lane beside it.
  const cell = {};
  for (const [row, nodes] of Object.entries(rows)) {
    nodes.sort((a, b) => (a === "blocked") - (b === "blocked"));
    nodes.forEach((node, i) => cell[node] = [Number(row), i]);

/** Every test report the run produced, in order: the baseline, then one per verify (null while it runs). */
function reports(detail) {

  for (const step of detail.steps) {
    if (step.node === "baseline") out.push({step, label: "Baseline", report: step.changes?.baseline?.report || null});
    if (step.node !== "verify") continue;
    // A checkpoint only stores what changed, so a verify that failed like the last one carries no report.
    const report = step.changes?.verification?.report || (step.ended ? last : null);
    if (report) last = report;

  out.filter(r => r.step.node === "verify").forEach((r, i) => r.label = "#" + (i + 1));

}

/* ---------- attempt table: one row per phase on a shared time axis ---------- */

  for (const step of detail.steps) {

    else if (step.node === "baseline") open("baseline");
    else if (step.node === "investigate" || step.node === "repair") { if (!inAttempt()) open("attempt"); }
    else if (step.node === "verify") { if (current?.kind !== "attempt") open("attempt"); }
    else if (current?.kind !== "finish") open("finish");
