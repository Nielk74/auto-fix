<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Fix Runs</title>
<style>
:root {
  --header: #27282e; --header-text: #dfe1e5; --header-muted: #9da0a8;
  --bg: #ffffff; --side: #f7f8fa; --border: #ebecf0; --border-strong: #dfe1e5;
  --text: #1e1f22; --muted: #6c707e; --faint: #a8adbd;
  --blue: #3574f0; --blue-soft: #edf3ff; --sel: #d5e1ff; --hover: #f2f4f7;
  --green: #208a3c; --green-icon: #4fa45d; --green-soft: #eef7f0;
  --red: #db3b4b; --red-soft: #fff4f4; --orange: #c27d04; --orange-soft: #fff7e6;
  --log: #fafbfc; --edge: #c9ccd6;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --header: #2b2d30; --header-text: #dfe1e5; --header-muted: #868a91;
    --bg: #1e1f22; --side: #2b2d30; --border: #393b40; --border-strong: #43454a;
    --text: #dfe1e5; --muted: #868a91; --faint: #5a5d63;
    --blue: #548af7; --blue-soft: #25324d; --sel: #2e436e; --hover: #2e3035;
    --green: #5fad65; --green-icon: #5fad65; --green-soft: #253627;
    --red: #e55765; --red-soft: #402929; --orange: #d6ae58; --orange-soft: #3d3223;
    --log: #191a1c; --edge: #4e5157;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: 44px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* top bar */
header { background: var(--header); color: var(--header-text); display: flex; align-items: center;
  gap: 18px; padding: 0 16px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.brand svg { flex: none; }
.nav { color: var(--header-muted); font-size: 13px; }
.nav b { color: var(--header-text); font-weight: 500; }
.root { color: var(--header-muted); font-family: var(--mono); font-size: 11.5px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.live { display: flex; align-items: center; gap: 7px; color: var(--header-muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
.live input { accent-color: var(--blue); }

main { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }

/* sidebar tree */
aside { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.search { padding: 12px 12px 8px; }
.search input { width: 100%; height: 28px; padding: 0 9px; font: inherit; color: var(--text); border-radius: 4px;
  border: 1px solid var(--border-strong); background: var(--bg); outline: none; }
.search input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--border); }
.filter { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border-strong); background: var(--bg);
  color: var(--muted); border-radius: 4px; padding: 1px 7px; font: inherit; font-size: 12px; cursor: pointer; }
.filter.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
#tree { overflow: auto; flex: 1; padding: 6px 0 16px; }
.group { display: flex; align-items: center; gap: 6px; padding: 4px 12px; color: var(--text); font-weight: 600;
  cursor: pointer; user-select: none; }
.group:hover { background: var(--hover); }
.group .chev { width: 10px; color: var(--muted); font-size: 10px; }
.group .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.group .count .bad { color: var(--red); }
.leaf { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 30px; cursor: pointer; min-width: 0; }
.leaf:hover { background: var(--hover); }
.leaf.sel { background: var(--sel); }
.leaf .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.leaf .tm { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

/* status icons */
.ico { flex: none; display: inline-block; vertical-align: -3px; }
.spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
.t-ok { color: var(--green); } .t-bad { color: var(--red); } .t-warn { color: var(--orange); }
.t-run { color: var(--blue); } .t-none { color: var(--muted); }

/* content */
#content { overflow: auto; min-width: 0; }
.page { padding: 18px 26px 48px; max-width: 1500px; }
.crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
.crumbs a { color: var(--muted); } .crumbs a:hover { color: var(--blue); }
.headline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.headline h1 { font-size: 20px; font-weight: 600; margin: 0; }
.headline .num { font-family: var(--mono); font-weight: 500; color: var(--muted); font-size: 15px; }
.result { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0 4px; font-size: 14px; }
.result b { font-weight: 600; }
.result .why { white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 26px;
  margin: 14px 0 6px; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.fact .k { color: var(--muted); font-size: 12px; }
.fact .v { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact .v.big { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); margin: 16px 0 16px; overflow-x: auto; overflow-y: hidden; }
.tab { background: none; border: none; font: inherit; color: var(--muted); padding: 9px 0 8px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--blue); }
.tab .n { color: var(--muted); margin-left: 4px; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.box { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); min-width: 0; }
.box > .hd { padding: 9px 14px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.box > .hd .sub { color: var(--muted); font-weight: 400; }
.box > .bd { padding: 12px 14px; }
.overview { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 48px 0; text-align: center; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
tr.sel td { background: var(--sel); }
td .ellipsis { display: block; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* graph */
svg text { font: 12px Inter, system-ui, sans-serif; fill: var(--text); }
.node rect { fill: var(--bg); stroke: var(--border-strong); }
.node.idle text { fill: var(--faint); }
.node.hit rect { stroke: var(--blue); stroke-width: 1.4; fill: var(--blue-soft); }
.node.end-bad rect { stroke: var(--red); fill: var(--red-soft); }
.node.end-ok rect { stroke: var(--green); fill: var(--green-soft); }
.node.cut rect { stroke: var(--orange); fill: var(--orange-soft); stroke-dasharray: 4 3; }
.node .count { font-size: 11px; fill: var(--blue); font-weight: 600; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.1; }
.edge.cond { stroke-dasharray: 3 3; }
.edge.hit { stroke: var(--blue); stroke-width: 2; stroke-dasharray: none; }
.edge-label { font-size: 10.5px !important; fill: var(--blue) !important; font-weight: 600; }

/* step table with duration bars */
.bar { height: 6px; background: var(--hover); border-radius: 3px; position: relative; min-width: 80px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--blue); min-width: 3px; }

/* build log */
.log { background: var(--log); border: 1px solid var(--border); border-radius: 6px; font-family: var(--mono); font-size: 12px; padding: 6px 0; overflow-x: auto; }
.line { display: grid; grid-template-columns: 82px 16px minmax(0, 1fr) auto; gap: 8px; padding: 2px 12px; align-items: baseline; cursor: pointer; }
.line:hover { background: var(--hover); }
.line .ts { color: var(--faint); }
.line .tw { color: var(--muted); }
.line .ms { color: var(--muted); }
.line.bad .nm { color: var(--red); } .line.warn .nm { color: var(--orange); }
.nest { margin-left: 118px; padding: 4px 12px 8px 12px; border-left: 1px solid var(--border-strong); }
.nest .row { color: var(--muted); }
button.link { background: none; border: none; padding: 0; font: inherit; color: var(--blue); cursor: pointer; }
button.link:hover { text-decoration: underline; }
button.btn { font: inherit; font-size: 12.5px; padding: 3px 12px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); }
button.btn:hover { border-color: var(--blue); }

/* json */
.json { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
.json details { margin-left: 14px; }
.json summary { cursor: pointer; margin-left: -14px; list-style: none; }
.json summary::-webkit-details-marker { display: none; }
.json summary::before { content: "▸ "; color: var(--muted); }
.json details[open] > summary::before { content: "▾ "; }
.json .k { color: #871094; } .json .s { color: #067d17; } .json .n { color: #1750eb; } .json .b { color: #0033b3; }
.json .hint { color: var(--muted); }
@media (prefers-color-scheme: dark) {
  .json .k { color: #c77dbb; } .json .s { color: #6aab73; } .json .n { color: #2aacb8; } .json .b { color: #cf8e6d; }
}

/* model calls and artifacts */
.edit { border: 1px solid var(--border); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.edit .path { font-family: var(--mono); font-size: 12px; padding: 4px 10px; background: var(--side); border-bottom: 1px solid var(--border); }
.edit pre { margin: 0; padding: 5px 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.edit .old { background: var(--red-soft); } .edit .new { background: var(--green-soft); }
.split { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.file { display: flex; justify-content: space-between; gap: 8px; padding: 4px 12px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
.file:hover { background: var(--hover); } .file.sel { background: var(--sel); }
.file span:last-child { color: var(--muted); white-space: nowrap; }
pre.view { margin: 0; padding: 10px 14px; overflow: auto; max-height: 72vh; font-family: var(--mono); font-size: 12px; white-space: pre; background: var(--log); }
pre.view .add { color: var(--green); } pre.view .del { color: var(--red); } pre.view .hunk { color: var(--blue); }

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); }
  aside { border-right: none; border-bottom: 1px solid var(--border); }
  .overview, .split { grid-template-columns: minmax(0, 1fr); }
  .overview svg { max-width: 360px; display: block; margin: 0 auto; }
  .page { padding: 14px 16px 40px; }
  .nav, .root { display: none; }
  .hide-sm { display: none; }
  .line { grid-template-columns: 62px 14px minmax(0, 1fr) auto; }
  .nest { margin-left: 16px; }
  .box { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <div class="brand" id="home" title="All runs">
    <svg class="ico" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="4" fill="#3574f0"/><path d="M5 10.5l3 3 7-7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Auto Fix
  </div>
  <div class="nav"><b>Runs</b></div>
  <div class="root" id="root"></div>
  <label class="live"><input type="checkbox" id="live" checked> Live refresh</label>
</header>
<main>
  <aside>
    <div class="search"><input type="search" id="q" placeholder="Search runs, builds, tests, reasons"></div>
    <div class="filters" id="filters"></div>
    <div id="tree"></div>
  </aside>
  <section id="content"></section>
</main>
<script>
"use strict";
const FILTERS = [["ok", "Successful"], ["bad", "Blocked"], ["warn", "Needs attention"], ["run", "Running"]];
const STATUS = {
  published: {tone: "ok", text: "Published"},
  ready: {tone: "ok", text: "Ready (local candidate)"},
  blocked: {tone: "bad", text: "Blocked"},
  publication_unknown: {tone: "warn", text: "Publication unknown"},
  in_progress: {tone: "run", text: "Running"},
  interrupted: {tone: "bad", text: "Interrupted"},
  validated: {tone: "ok", text: "validated"},
  verification_failed: {tone: "bad", text: "verification failed"},
  invalid_proposal: {tone: "warn", text: "invalid proposal"},
};
const status = key => STATUS[key] || {tone: "none", text: key || "—"};
const state = {runs: [], filters: new Set(), collapsed: new Set(),
  selected: new URLSearchParams(location.hash.slice(1)).get("run"),
  detail: null, tab: "overview", openSteps: new Set(), file: null, call: null};

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null && value !== false) node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function svg(tag, attrs = {}, ...children) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  for (const child of children.flat()) if (child) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}
/* Round status icons: check, cross, exclamation, spinner. */
function icon(tone, size = 14) {
  const s = svg("svg", {class: "ico t-" + tone + (tone === "run" ? " spin" : ""), width: size, height: size, viewBox: "0 0 16 16", "aria-hidden": "true"});
  if (tone === "run") {
    s.append(svg("circle", {cx: 8, cy: 8, r: 6, fill: "none", stroke: "currentColor", "stroke-opacity": ".25", "stroke-width": 2}),
      svg("path", {d: "M8 2a6 6 0 0 1 6 6", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round"}));
    return s;
  }
  s.append(svg("circle", {cx: 8, cy: 8, r: 7, fill: tone === "ok" ? "var(--green-icon)" : "currentColor"}));
  const mark = {ok: "M4.8 8.3l2.2 2.2 4.2-4.6", bad: "M5.5 5.5l5 5M10.5 5.5l-5 5", warn: "M8 4.5v4.2M8 11.2v.1", none: "M5.5 8h5"}[tone];
  s.append(svg("path", {d: mark, fill: "none", stroke: "#fff", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round"}));
  return s;
}
function duration(seconds) {
  if (seconds === null || seconds === undefined) return "—";
  if (seconds < 1) return Math.round(seconds * 1000) + "ms";
  if (seconds < 60) return seconds.toFixed(seconds < 10 ? 1 : 0) + "s";
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  return m < 60 ? `${m}m:${String(s).padStart(2, "0")}s` : `${Math.floor(m / 60)}h:${String(m % 60).padStart(2, "0")}m`;
}
function when(iso, withDate = true) {
  if (!iso) return "—";
  const d = new Date(iso);
  return withDate
    ? d.toLocaleString(undefined, {day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit"})
    : d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false});
}
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
async function api(path) {
  const response = await fetch(path, {cache: "no-store"});
  if (!response.ok) throw new Error(response.status + " " + path);
  return response.headers.get("Content-Type").includes("json") ? response.json() : response.text();
}
function tree(value, depth = 0) {
  if (value === null) return el("span", {class: "b"}, "null");
  if (typeof value === "string") return el("span", {class: "s"}, value.length > 160 && value.includes("\n") ? value : JSON.stringify(value));
  if (typeof value === "number") return el("span", {class: "n"}, String(value));
  if (typeof value === "boolean") return el("span", {class: "b"}, String(value));
  const entries = Array.isArray(value) ? value.map((v, i) => [i, v]) : Object.entries(value);
  const open = Array.isArray(value) ? "[" : "{", close = Array.isArray(value) ? "]" : "}";
  if (!entries.length) return el("span", {class: "hint"}, open + close);
  const details = el("details", depth < 1 ? {open: ""} : {},
    el("summary", {}, el("span", {class: "hint"}, `${open} ${entries.length} ${Array.isArray(value) ? "items" : "keys"} ${close}`)));
  for (const [key, item] of entries)
    details.append(el("div", {}, el("span", {class: "k"}, Array.isArray(value) ? key : JSON.stringify(key)), ": ", tree(item, depth + 1)));
  return details;
}
const jsonView = value => el("div", {class: "json"}, tree(value));
const groupName = run => run.group || "State directory";

/* ---------- sidebar ---------- */
function visibleRuns() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return state.runs.filter(run => (!state.filters.size || state.filters.has(status(run.status).tone)) &&
    (!q || [run.id, run.build_id, run.build_type, run.reason, run.group, ...run.tests].join(" ").toLowerCase().includes(q)));
}
function renderSidebar() {
  document.getElementById("filters").replaceChildren(...FILTERS.map(([tone, label]) => {
    const count = state.runs.filter(run => status(run.status).tone === tone).length;
    return el("button", {class: "filter" + (state.filters.has(tone) ? " on" : ""), onclick: () => {
      state.filters.has(tone) ? state.filters.delete(tone) : state.filters.add(tone);
      renderSidebar(); if (!state.selected) renderHome();
    }}, icon(tone, 12), `${label} ${count}`);
  }));
  const runs = visibleRuns(), groups = new Map();
  for (const run of runs) (groups.get(groupName(run)) || groups.set(groupName(run), []).get(groupName(run))).push(run);
  const box = document.getElementById("tree");
  if (!runs.length) { box.replaceChildren(el("div", {class: "empty"}, state.runs.length ? "No run matches." : "No runs yet.")); return; }
  const nodes = [];
  for (const [name, items] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
    const bad = items.filter(run => status(run.status).tone === "bad").length;
    const collapsed = state.collapsed.has(name);
    nodes.push(el("div", {class: "group", onclick: () => { collapsed ? state.collapsed.delete(name) : state.collapsed.add(name); renderSidebar(); }},
      el("span", {class: "chev"}, collapsed ? "▸" : "▾"), name,
      el("span", {class: "count"}, String(items.length), bad ? el("span", {class: "bad"}, ` · ${bad} blocked`) : null)));
    if (collapsed) continue;
    for (const run of items) nodes.push(el("div", {class: "leaf" + (run.id === state.selected ? " sel" : ""), title: run.id, onclick: () => select(run.id)},
      icon(status(run.status).tone), el("span", {class: "nm"}, run.name), el("span", {class: "tm"}, ago(run.started))));
  }
  box.replaceChildren(...nodes);
}

/* ---------- home: build history ---------- */
function renderHome() {
  const runs = visibleRuns();
  const ok = state.runs.filter(run => status(run.status).tone === "ok").length;
  document.getElementById("content").replaceChildren(el("div", {class: "page"},
    el("div", {class: "headline"}, el("h1", {}, "Run history")),
    el("div", {class: "muted", style: "margin:4px 0 16px"},
      `${state.runs.length} runs · ${ok} successful · ${state.runs.length - ok} other`),
    runs.length ? el("div", {class: "box"}, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, "Run"), el("th", {class: "hide-sm"}, "Group"), el("th", {}, "Result"),
        el("th", {class: "hide-sm"}, "Started"), el("th", {class: "num"}, "Duration"), el("th", {class: "num hide-sm"}, "Attempts"))),
      el("tbody", {}, runs.map(run => {
        const st = status(run.status);
        return el("tr", {class: "click", onclick: () => select(run.id)},
          el("td", {style: "width:28px"}, icon(st.tone)),
          el("td", {class: "mono", style: "white-space:nowrap"}, run.name),
          el("td", {class: "hide-sm muted"}, groupName(run)),

/* ---------- graph ---------- */
