name: Trusted native guards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.project }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: [abseil, fmt]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Compile and execute trusted guards against pinned upstream
        env:
          GUARD_PROJECT: ${{ matrix.project }}
          GUARD_DIRECTORY: ${{ runner.temp }}/af-guard
        shell: pwsh
        run: >-
          uv run --no-sync python scripts/check-native-guards.py
          --project "$env:GUARD_PROJECT" --directory "$env:GUARD_DIRECTORY"
      - name: Upload actual native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-${{ matrix.os }}-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/af-guard/result.json
            ${{ runner.temp }}/af-guard/junit.xml
            ${{ runner.temp }}/af-guard/junit.evidence.json
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/p/probe.cc
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/p/CMakeLists.txt
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/project/probe.cc
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/project/CMakeLists.txt
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/b/sanitizer.txt
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/r/**/*.log
            ${{ runner.temp }}/af-guard/source/.auto-fix-build/**/runs/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
