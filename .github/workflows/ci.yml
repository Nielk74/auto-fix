name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Parse PowerShell wrappers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Test
        run: uv run --no-sync pytest --junitxml=.auto-fix/ci/pytest.xml
      - name: Native C++ workflow demo
        run: uv run --no-sync auto-fix demo --directory .auto-fix/ci/demo
      - name: Replay recorded Luna repairs against real Abseil tests
        if: matrix.python == '3.12'
        run: uv run --no-sync auto-fix evaluate --backend replay --directory .auto-fix/ci/abseil --recordings evaluation/recordings/accepted
      - name: Upload synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .auto-fix/ci/
            !.auto-fix/ci/abseil/**/.auto-fix-build/**
            !.auto-fix/ci/abseil/**/source/**
            !.auto-fix/ci/abseil/**/remote.git/**
            !.auto-fix/ci/abseil/**/worktrees/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
